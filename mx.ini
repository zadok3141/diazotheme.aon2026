; This is a mxdev configuration file
; it can be used to override versions of packages already defined in the
; constraints files and to add new packages from VCS like git.
; to learn more about mxdev visit https://pypi.org/project/mxdev/

[settings]
main-package = -e .[test]

; Security hotfixes layered ON TOP of the Plone 6.2.0 KGS.
; Neither advisory below is included in the 6.2.0 release -- both were published
; after it and are still listed as required at https://plone.org/security/hotfixes
; (checked 2026-07-21). Every pin here sits strictly above the version the 6.2.0
; constraints file resolves to; RestrictedPython additionally overrides the Zope
; 6.1 KGS, which ships 8.1.
;
; Remove a pin only once a 6.2.x release folds it in -- re-check the hotfixes
; page on every version bump. A stale override silently DOWNGRADES the KGS.
;
; PSA-20260605 -- stored XSS via mimetype spoofing
; PSA-20260623 -- RCE via TALES injection + DoS set
version-overrides =
    plone.app.textfield==4.0.1
    plone.restapi==10.0.1
    icalendar==7.1.3
    plone.app.contenttypes==5.0.1
    plone.app.dexterity==5.0.1
    plone.app.event==6.0.1
    plone.app.portlets==7.0.2
    RestrictedPython==8.3

; example section to use packages from git
; [example.contenttype]
; url = https://github.com/collective/example.contenttype.git
; pushurl = git@github.com:collective/example.contenttype.git
; extras = test
; branch = master

[aon2026.settings]
url = https://github.com/zadok3141/aon2026.settings.git
branch = devel
extras = test
pushurl = git@github.com:zadok3141/aon2026.settings.git
install-mode = editable
